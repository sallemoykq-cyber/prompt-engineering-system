<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptForge - Edge</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --bg: #0a0a0f;
            --bg2: #11111b;
            --card: #1e1e2f;
            --border: #2a2a40;
            --text: #e4e4e7;
            --text-muted: #a1a1aa;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            padding: 16px;
            min-width: 360px;
        }
        h2 { 
            font-size: 18px; font-weight:700; margin-bottom:4px;
            display:flex; align-items:center; gap:8px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .subtitle { font-size:11px; color: var(--text-muted); margin-bottom:16px; }
        .live-badge {
            display:inline-flex; align-items:center; gap:6px;
            background: rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3);
            color: var(--success); padding:3px 8px; border-radius:12px; font-size:10px; font-weight:600;
            margin-bottom:12px;
        }
        .live-badge .dot { width:5px; height:5px; background: var(--success); border-radius:50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .section { background: var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
        label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color: var(--text-muted); margin-bottom:6px; margin-top:10px; }
        label:first-child { margin-top:0; }
        input, select, textarea {
            width:100%; background: var(--card); border:1px solid var(--border); border-radius:8px;
            color: var(--text); padding:10px 12px; font-size:13px; font-family:inherit; outline:none; transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
        textarea { min-height:70px; resize:vertical; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .platform-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px; }
        .p-card {
            background: var(--card); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center;
            cursor:pointer; transition: all 0.2s; font-size:11px; font-weight:600;
        }
        .p-card.active { border-color: var(--primary); background: rgba(124,58,237,0.15); box-shadow: 0 0 0 1px var(--primary); }
        .p-card .icon { font-size:16px; display:block; margin-bottom:2px; }
        button {
            background: linear-gradient(135deg, #7c3aed, #06b6d4); border:none; color:white;
            padding:12px; border-radius:10px; width:100%; font-weight:600; cursor:pointer; font-size:13px;
            display:flex; align-items:center; justify-content:center; gap:8px; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.4); }
        button.secondary { background: var(--card); border:1px solid var(--border); box-shadow:none; color: var(--text); }
        button.secondary:hover { background: #25253a; }
        #output {
            background: var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px;
            min-height:120px; max-height:400px; overflow-y:auto; white-space:pre-wrap; font-family: 'JetBrains Mono', monospace;
            font-size:12px; line-height:1.5; margin-top:12px;
        }
        .output-header { display:flex; justify-content:space-between; align-items:center; margin-top:14px; margin-bottom:6px; }
        .output-header span { font-size:11px; font-weight:600; text-transform:uppercase; color: var(--text-muted); letter-spacing:0.5px; }
        .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
        .metric { background: var(--card); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; }
        .metric .val { font-size:16px; font-weight:700; color: #a78bfa; }
        .metric .lbl { font-size:10px; color: var(--text-muted); text-transform:uppercase; }
        .hint { font-size:11px; color: var(--text-muted); margin-top:6px; line-height:1.3; }
        .footer { text-align:center; margin-top:16px; font-size:10px; color: #52525b; }
        .footer a { color: #71717a; text-decoration:none; }
    </style>
</head>
<body>
    <h2>🧠 PromptForge</h2>
    <div class="subtitle">Multi-AI Canlı Prompt Sistemi</div>
    <div class="live-badge"><span class="dot"></span> CANLI SİSTEM AKTİF</div>

    <div class="section">
        <label>Platform</label>
        <div class="platform-grid" id="platformGrid">
            <div class="p-card active" data-p="chatgpt"><span class="icon">🤖</span>ChatGPT</div>
            <div class="p-card" data-p="gemini"><span class="icon">✨</span>Gemini</div>
            <div class="p-card" data-p="qwen"><span class="icon">🌙</span>Qwen</div>
            <div class="p-card" data-p="zai"><span class="icon">⚡</span>Z.ai</div>
        </div>

        <label>Rol / Persona</label>
        <input type="text" id="role" placeholder="Örn: Kıdemli Yazılım Mühendisi">

        <label>Görev *</label>
        <textarea id="task" placeholder="Ne yapılmasını istiyorsunuz? Detaylı yazın..."></textarea>

        <label>Bağlam</label>
        <input type="text" id="context" placeholder="Hedef kitle, proje detayları...">

        <div class="grid2">
            <div>
                <label>Teknik</label>
                <select id="technique">
                    <option value="standard">Standart</option>
                    <option value="cot">Chain of Thought</option>
                    <option value="fewshot">Few-Shot</option>
                    <option value="roleplay">Role-Play</option>
                    <option value="react">ReAct</option>
                    <option value="tot">Tree of Thoughts</option>
                    <option value="refiner">Refiner</option>
                    <option value="meta">Meta-Prompt</option>
                </select>
            </div>
            <div>
                <label>Format</label>
                <select id="format">
                    <option value="Markdown">Markdown</option>
                    <option value="Düz Metin">Düz Metin</option>
                    <option value="JSON">JSON</option>
                    <option value="Tablo">Tablo</option>
                    <option value="Kod">Kod</option>
                </select>
            </div>
        </div>
        <div class="grid2" style="margin-top:8px">
            <div>
                <label>Ton</label>
                <select id="tone">
                    <option value="friendly">Samimi</option>
                    <option value="formal">Resmi</option>
                    <option value="expert">Uzman</option>
                    <option value="creative">Yaratıcı</option>
                    <option value="concise">Öz</option>
                </select>
            </div>
            <div>
                <label>Dil</label>
                <select id="lang">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </div>

    <button id="generateBtn">✨ Prompt Oluştur</button>

    <div id="resultArea" style="display:none">
        <div class="output-header">
            <span>Oluşturulan Prompt</span>
            <span id="tokenInfo" style="font-size:10px"></span>
        </div>
        <div id="output"></div>
        <div class="metrics" id="metrics" style="display:none">
            <div class="metric"><div class="val" id="mScore">--</div><div class="lbl">Skor</div></div>
            <div class="metric"><div class="val" id="mToken">--</div><div class="lbl">Token</div></div>
            <div class="metric"><div class="val" id="mLevel">--</div><div class="lbl">Seviye</div></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
            <button class="secondary" id="copyBtn">📋 Kopyala</button>
            <button class="secondary" id="optimizeBtn">⚡ Optimize</button>
        </div>
        <button class="secondary" id="openWebBtn" style="margin-top:8px">🌐 Web Uygulamasında Aç</button>
    </div>

    <div class="footer">
        Canlı sistem: <a href="#" id="localLink">localhost:3000</a> • v2.0<br>
        4 Platform • 8 Teknik • Gerçek zamanlı analiz
    </div>

    <script src="script.js"></script>
</body>
</html>
